name: Build & Release

# Сборка идёт здесь; локально собирается только debug для проверки кода.
#  • пуш тега:        git tag v0.0.1-beta-1 && git push origin v0.0.1-beta-1
#      → релизный APK, SHA256SUMS + GitHub Release (файлы ПК-версии добавляет desktop.yml)
#  • вручную без тега: вкладка Actions → Run workflow, поле пустое
#      → просто соберёт release APK в артефакты
#  • вручную с тегом:  release_tag = v0.0.1-beta-1
#      → соберёт, заведёт тег на выбранном коммите и выпустит релиз
#  • пуш в main: тесты, lint и сборка release APK — без выпуска
on:
  push:
    # И ветка тоже: без этого на main не запускалось вообще ничего, и
    # тесты с lint жили бы только в локальной привычке. Релиз при этом
    # по-прежнему выпускается только по тегу — см. условие в job release.
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Тег релиза, например v0.0.1-beta-1. Пусто — только сборка."
        required: false
        default: ""

permissions:
  contents: write

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: ${{ github.ref != 'refs/heads/main' }}

      # innertubex приходит с JitPack, и первая сборка версии там может
      # собираться минутами. Кеш Gradle это гасит, но на холодном раннере
      # шаг бывает долгим — это нормально, а не зависание.
      - name: Set up release signing
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/texfi-release.jks"
            echo "ANDROID_KEYSTORE_FILE=$RUNNER_TEMP/texfi-release.jks" >> "$GITHUB_ENV"
          else
            echo "::warning::Нет секрета с keystore — сборка уйдёт на debug-ключ, такой APK не раздаём."
          fi

      # Проверки до сборки: lint ловит то, что компилятор пропускает —
      # например, вид, недопустимый в виджете (RemoteViews принимает лишь
      # известный ей список классов, и обычный View в него не входит).
      - name: Unit tests
        run: ./gradlew testDebugUnitTest --no-daemon

      - name: Lint
        run: ./gradlew lintDebug --no-daemon

      - name: Build release APK
        env:
          ANDROID_STORE_PASSWORD: ${{ secrets.ANDROID_STORE_PASSWORD }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          ANDROID_KEY_ALIAS: texfi
        run: ./gradlew assembleRelease --no-daemon

      - name: Collect APK
        run: |
          mkdir -p out
          cp app/build/outputs/apk/release/app-release*.apk out/TexFi-w0y-android.apk

      # ПК-версия (Windows и Linux) собирается отдельным workflow desktop.yml и прикрепляется к этому же релизу.

      - name: Checksums and release name
        if: >-
          startsWith(github.ref, 'refs/tags/v') ||
          (github.event_name == 'workflow_dispatch' && inputs.release_tag != '')
        env:
          TAG: ${{ inputs.release_tag || github.ref_name }}
        run: |
          (cd out && sha256sum * > SHA256SUMS.txt && cat SHA256SUMS.txt)
          # v0.0.1-beta-1 → «v0.0.1 beta-1»
          echo "RELEASE_NAME=${TAG/-beta/ beta}" >> "$GITHUB_ENV"

      # Артефакт — только когда сборку запустили руками ради тестового
      # APK. На каждом коммите он копился бы впустую и съедал квоту
      # хранилища аккаунта, а именно в неё сборка уже один раз и упёрлась.
      # Провал загрузки не должен ронять зелёную сборку: файл здесь —
      # удобство, а не результат.
      - uses: actions/upload-artifact@v4
        if: github.event_name == 'workflow_dispatch'
        continue-on-error: true
        with:
          name: texfi-w0y-android
          path: out/TexFi-w0y-android.apk
          if-no-files-found: error
          retention-days: 14

      # Релиз выпускается той же job, которая собрала APK: отдельная job
      # означала бы прогон файла через хранилище артефактов туда и обратно
      # — лишняя зависимость от квоты ровно в тот момент, когда выпуск
      # нужен больше всего.
      - name: Create release
        if: >-
          startsWith(github.ref, 'refs/tags/v') ||
          (github.event_name == 'workflow_dispatch' && inputs.release_tag != '')
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.release_tag || github.ref_name }}
          name: ${{ env.RELEASE_NAME }}
          target_commitish: ${{ github.sha }}
          # Описание выпуска лежит в репозитории и правится вместе с кодом.
          body_path: docs/RELEASE_NOTES.md
          # Автосписок коммитов не дописываем: в нём тянется вся история.
          generate_release_notes: false
          # Обычный релиз, не pre-release: сайт texfi-hub берёт выпуск через
          # /releases/latest, а этот адрес pre-release пропускает.
          prerelease: false
          make_latest: true
          files: out/*
